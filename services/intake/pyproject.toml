[project]
name = "homeflow-intake"
version = "0.1.0"
description = "LangChain file validation + classification"
requires-python = ">=3.12"
dependencies = [
  "homeflow-common",
  "langchain>=0.3",
  "langchain-anthropic>=0.2",
  "python-magic>=0.4",
]

[tool.uv.sources]
homeflow-common = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeflow_intake"]
