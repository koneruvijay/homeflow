[project]
name = "homeflow-processor"
version = "0.1.0"
description = "Async pipeline: convert, redact, chunk, embed, store"
requires-python = ">=3.12"
dependencies = [
  "homeflow-common",
  "langchain>=0.3",
  "langchain-text-splitters>=0.3",
  "unstructured>=0.15",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "pgvector>=0.3",
]

[tool.uv.sources]
homeflow-common = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeflow_processor"]
