[project]
name = "homeflow-chat"
version = "0.1.0"
description = "Chatbot backend: RAG retrieval + answer generation"
requires-python = ">=3.12"
dependencies = [
  "homeflow-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langchain>=0.3",
  "langchain-anthropic>=0.2",
  "pgvector>=0.3",
]

[tool.uv.sources]
homeflow-common = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeflow_chat"]
