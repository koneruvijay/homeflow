name: chat
on:
  push:
    branches: [main]
    paths:
      - services/chat/**
      - packages/py-common/**
      - packages/contracts/**
      - .github/workflows/chat.yml
  pull_request:
    paths:
      - services/chat/**
      - packages/py-common/**
      - packages/contracts/**
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f services/chat/Dockerfile -t homeflow/chat:${{ github.sha }} .
