name: api
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/py-common/**
      - packages/contracts/**
      - .github/workflows/api.yml
  pull_request:
    paths:
      - apps/api/**
      - packages/py-common/**
      - packages/contracts/**
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t homeflow/api:${{ github.sha }} .
