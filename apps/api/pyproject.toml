[project]
name = "homeflow-api"
version = "0.1.0"
description = "API layer: auth, uploads, status, chat proxy"
requires-python = ">=3.12"
dependencies = [
  "homeflow-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
]

[tool.uv.sources]
homeflow-common = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeflow_api"]
